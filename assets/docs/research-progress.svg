<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
<title id="title">E-PL9 research evidence on 2026-11-04</title><desc id="desc">Three distinct paths: actual desktop v0 TIFF renders, native CPU configuration stopping before ISP pixels, and reported offline update validation without a validated physical install or recovery procedure.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#506273"/></marker></defs>
<rect width="1400" height="980" fill="#f5f3ed"/>
<text x="54" y="48" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#506273">
<tspan x="54" dy="0">E-PL9 LAB / EVIDENCE MAP / 2026-11-04</tspan>
</text>
<text x="54" y="102" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="700" fill="#14283c">
<tspan x="54" dy="0">Different paths. Different conclusions.</tspan>
</text>
<text x="54" y="144" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#506273">
<tspan x="54" dy="0">Desktop images are real. They do not complete the modified camera pipeline or validate flashing.</tspan>
</text>
<rect x="54" y="188" width="1292" height="210" rx="16" fill="white" stroke="#d8dedf" stroke-width="2"/>
<text x="76" y="220" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#2c7d79">
<tspan x="76" dy="0">DESKTOP / PUBLISHED</tspan>
</text>
<rect x="76" y="241" width="296" height="93" rx="10" fill="#f4f7f7" stroke="#2c7d79" stroke-width="2"/>
<text x="91" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#14283c">
<tspan x="91" dy="0">Copied owner ORF</tspan>
</text>
<text x="91" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#506273">
<tspan x="91" dy="0">RAW samples preserved</tspan>
</text>
<path d="M375 287 L394 287" stroke="#506273" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="399" y="241" width="296" height="93" rx="10" fill="#f4f7f7" stroke="#2c7d79" stroke-width="2"/>
<text x="414" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#14283c">
<tspan x="414" dy="0">CMIO v0 coefficients</tspan>
</text>
<text x="414" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#506273">
<tspan x="414" dy="0">Separate Gold / Portra</tspan>
</text>
<path d="M698 287 L717 287" stroke="#506273" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="722" y="241" width="296" height="93" rx="10" fill="#f4f7f7" stroke="#2c7d79" stroke-width="2"/>
<text x="737" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#14283c">
<tspan x="737" dy="0">OM Workspace</tspan>
</text>
<text x="737" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#506273">
<tspan x="737" dy="0">Actual manual export</tspan>
</text>
<path d="M1021 287 L1040 287" stroke="#506273" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1045" y="241" width="296" height="93" rx="10" fill="#f4f7f7" stroke="#2c7d79" stroke-width="2"/>
<text x="1060" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#14283c">
<tspan x="1060" dy="0">4608 x 3456 TIFF</tspan>
</text>
<text x="1060" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#506273">
<tspan x="1060" dy="0">Distinct draft pixels</tspan>
</text>
<text x="76" y="370" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#506273">
<tspan x="76" dy="0">Established desktop color trials; one scene, subtle changes, no film calibration or camera equivalence.</tspan>
</text>
<rect x="54" y="421" width="1292" height="210" rx="16" fill="white" stroke="#d8dedf" stroke-width="2"/>
<text x="76" y="453" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#ae7b22">
<tspan x="76" dy="0">NATIVE JOB / PUBLISHED</tspan>
</text>
<rect x="76" y="474" width="296" height="93" rx="10" fill="#f4f7f7" stroke="#ae7b22" stroke-width="2"/>
<text x="91" y="505" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#14283c">
<tspan x="91" dy="0">Actual mosaic backing</tspan>
</text>
<text x="91" y="540" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#506273">
<tspan x="91" dy="0">Candidate input layout</tspan>
</text>
<path d="M375 520 L394 520" stroke="#506273" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="399" y="474" width="296" height="93" rx="10" fill="#f4f7f7" stroke="#ae7b22" stroke-width="2"/>
<text x="414" y="505" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#14283c">
<tspan x="414" dy="0">Native job + COLOR</tspan>
</text>
<text x="414" y="540" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#506273">
<tspan x="414" dy="0">Configuration executes</tspan>
</text>
<path d="M698 520 L717 520" stroke="#506273" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="722" y="474" width="296" height="93" rx="10" fill="#f4f7f7" stroke="#ae7b22" stroke-width="2"/>
<text x="737" y="505" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#14283c">
<tspan x="737" dy="0">Peripheral boundary</tspan>
</text>
<text x="737" y="540" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#506273">
<tspan x="737" dy="0">0x9880014c write</tspan>
</text>
<path d="M1021 520 L1040 520" stroke="#506273" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1045" y="474" width="296" height="93" rx="10" fill="#f4f7f7" stroke="#ae7b22" stroke-width="2"/>
<text x="1060" y="505" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#14283c">
<tspan x="1060" dy="0">No output pixels</tspan>
</text>
<text x="1060" y="540" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#506273">
<tspan x="1060" dy="0">ISP execution missing</tspan>
</text>
<text x="76" y="603" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#506273">
<tspan x="76" dy="0">Finite completion/status replay is separate. The CPU prefix reads no source pixels and leaves poisoned output.</tspan>
</text>
<rect x="54" y="654" width="1292" height="210" rx="16" fill="white" stroke="#d8dedf" stroke-width="2"/>
<text x="76" y="686" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#a54339">
<tspan x="76" dy="0">INSTALL / REPORTED AUDIT</tspan>
</text>
<rect x="76" y="707" width="296" height="93" rx="10" fill="#f4f7f7" stroke="#a54339" stroke-width="2"/>
<text x="91" y="738" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#14283c">
<tspan x="91" dy="0">Offline package checks</tspan>
</text>
<text x="91" y="773" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#506273">
<tspan x="91" dy="0">No installer available</tspan>
</text>
<path d="M375 753 L394 753" stroke="#506273" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="399" y="707" width="296" height="93" rx="10" fill="#f4f7f7" stroke="#a54339" stroke-width="2"/>
<text x="414" y="738" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#14283c">
<tspan x="414" dy="0">Native SD/service tests</tspan>
</text>
<text x="414" y="773" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#506273">
<tspan x="414" dy="0">Intercepted write intents</tspan>
</text>
<path d="M698 753 L717 753" stroke="#506273" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="722" y="707" width="296" height="93" rx="10" fill="#f4f7f7" stroke="#a54339" stroke-width="2"/>
<text x="737" y="738" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#14283c">
<tspan x="737" dy="0">Early physical entry</tspan>
</text>
<text x="737" y="773" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#506273">
<tspan x="737" dy="0">Survival of main unknown</tspan>
</text>
<path d="M1021 753 L1040 753" stroke="#506273" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1045" y="707" width="296" height="93" rx="10" fill="#f4f7f7" stroke="#a54339" stroke-width="2"/>
<text x="1060" y="738" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#14283c">
<tspan x="1060" dy="0">No physical install</tspan>
</text>
<text x="1060" y="773" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#506273">
<tspan x="1060" dy="0">Recovery unverified</tspan>
</text>
<text x="76" y="836" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#506273">
<tspan x="76" dy="0">Validator scenarios await published source. Same-build acceptance is not proof of a successful restore.</tspan>
</text>
<rect x="54" y="893" width="1292" height="53" rx="16" fill="#14283c" stroke="none" stroke-width="2"/>
<text x="76" y="927" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="white">
<tspan x="76" dy="0">Newer v1/v2 tone, Wi-Fi, timing/gyro and recovery reports need their own source and evidence.</tspan>
</text>
</svg>

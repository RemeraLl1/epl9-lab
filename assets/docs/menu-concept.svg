<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
<title id="title">Conceptual Gold 200 and Portra 400 selection cards</title><desc id="desc">Original wireframe, not a photograph or camera screenshot. Both example-image areas are placeholders because the E-PL9 recipes have not produced calibrated output.</desc>

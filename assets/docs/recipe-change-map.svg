<title id="title">Two ART slots, two planned film recipes</title><desc id="desc">Concept diagram, not installed firmware: Watercolor I maps to Gold 200 and Watercolor II maps to Portra 400. Processing, names, small icons and menu examples must be integrated together.</desc>
